[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "elliot-vllm"
version = "0.1.0"
description = "Elliot multimodal model support for vLLM"
requires-python = ">=3.11"
dependencies = ["vllm>=0.24,<0.25"]

[project.entry-points."vllm.general_plugins"]
elliot = "elliot_vllm:register"

[tool.setuptools.packages.find]
include = ["elliot_vllm*"]
